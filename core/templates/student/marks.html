{% extends 'base.html' %}
{% block title %}My Marks{% endblock %}
{% block page_title %}My Marks{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header">Marks Report</div>
    <div class="card-body p-0">
        <table class="table mb-0">
            <thead><tr><th>Subject</th><th>Exam</th><th>Marks</th></tr></thead>
            <tbody>
            {% for m in marks %}
                <tr>
                    <td>{{ m.subject.name }}</td>
                    <td>{{ m.exam_type }}</td>
                    <td><strong>{{ m.marks }}</strong>/100</td>
                </tr>
            {% empty %}
                <tr><td colspan="3" class="text-center text-muted py-4">No marks available.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
