<div class="topbar">
    <div><h5 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h5></div>
    <div class="user-info">
        <div class="avatar">{{ user.username|first|upper }}</div>
        <div class="d-none d-md-block">
            <strong>{{ user.get_full_name|default:user.username }}</strong>
            <small class="d-block text-muted">{{ user.get_role_display }}</small>
        </div>
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger ms-3">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </div>
</div>
